<meta charset="UTF-8">

<title>Eleven · Heavy Work — Catálogo & Pedidos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
:root{--pt:#000;--vm:#D60D20;--vm2:#a80a18;--cz:#f4f4f5;--cz2:#e4e4e7;--cz3:#a1a1aa;--tx:#18181b;--ok:#16a34a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Montserrat',Arial,sans-serif;background:var(--cz);color:var(--tx);font-size:15px;line-height:1.45;padding-bottom:80px;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;font-size:15px;}
a{color:inherit;}
header{background:var(--pt);color:#fff;position:sticky;top:0;z-index:50;}
.hdr-in{padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.logo{height:56px;width:auto;}
.selo{background:var(--vm);color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
.hdr-links{margin-left:auto;font-size:12px;color:var(--cz3);text-align:right;line-height:1.5;}
.hdr-links a{color:#fff;text-decoration:none;}
.aviso{background:#fff3cd;color:#664d03;border-bottom:2px solid #ffe69c;padding:10px 16px;font-size:12.5px;font-weight:600;text-align:center;}
.fluxo{background:#111;color:#fff;padding:10px 8px;overflow-x:auto;white-space:nowrap;font-size:11px;}
.fluxo span{display:inline-block;padding:4px 8px;color:var(--cz3);}
.fluxo b{color:#fff;}
.fluxo .arr{color:var(--vm);font-weight:900;}
.toolbar{padding:12px 16px;background:#fff;position:sticky;top:84px;z-index:40;border-bottom:1px solid var(--cz2);}
.search{width:100%;padding:11px 14px;border:2px solid var(--cz2);border-radius:8px;font-weight:500;}
.search:focus{outline:none;border-color:var(--vm);}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;}
.chip{background:var(--cz);border:1.5px solid var(--cz2);color:var(--tx);padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.chip.active{background:var(--pt);color:#fff;border-color:var(--pt);}
.count-info{font-size:12px;color:var(--cz3);margin-top:8px;font-weight:600;}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding:16px;max-width:1200px;margin:0 auto;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;border:1px solid var(--cz2);}
.card-img{position:relative;background:var(--cz);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;gap:8px;}
.ph .selo{position:static;}
.ph .phcode{font-weight:800;font-size:18px;color:var(--vm);}
.cat-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:4px;text-transform:uppercase;}
.card-body{padding:13px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-cat{font-size:11px;color:var(--vm);font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.card-name{font-size:16px;font-weight:800;line-height:1.2;}
.card-code{font-size:12px;color:var(--cz3);font-weight:700;font-family:monospace;}
.card-specs{font-size:11.5px;color:#52525b;line-height:1.5;margin:2px 0;}
.card-specs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prices{margin-top:auto;padding-top:8px;}
.p-vista{font-size:20px;font-weight:900;color:var(--pt);}
.p-vista small{font-size:11px;color:var(--ok);font-weight:700;}
.p-prazo{font-size:12px;color:var(--cz3);font-weight:600;}
.p-prazo s{color:var(--cz3);}
.no-price{font-size:12px;color:var(--vm);font-weight:700;}
.add{margin-top:10px;background:var(--vm);color:#fff;font-weight:800;padding:11px;border-radius:8px;font-size:14px;width:100%;transition:.15s;}
.add:active{background:var(--vm2);}
.add.in{background:var(--ok);}
</style><style>
.fab{position:fixed;bottom:18px;right:18px;background:var(--vm);color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(214,13,32,.5);z-index:60;font-size:24px;}
.fab .badge{position:absolute;top:-4px;right:-4px;background:#fff;color:var(--vm);font-size:12px;font-weight:900;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--vm);padding:0 4px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:.2s;}
.overlay.on{opacity:1;pointer-events:auto;}
.cart{position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:#fff;z-index:80;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;}
.cart.on{transform:translateX(0);}
.cart-hd{background:var(--pt);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;}
.cart-hd h2{font-size:17px;font-weight:800;flex:1;}
.x{background:transparent;color:#fff;font-size:24px;line-height:1;padding:0 4px;}
.cart-items{flex:1;overflow-y:auto;padding:12px;}
.ci{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--cz2);}
.ci img{width:60px;height:60px;object-fit:contain;background:var(--cz);border-radius:6px;flex-shrink:0;}
.ci-b{flex:1;min-width:0;}
.ci-name{font-size:13.5px;font-weight:800;line-height:1.2;}
.ci-code{font-size:11px;color:var(--cz3);font-family:monospace;font-weight:700;}
.ci-price{font-size:13px;font-weight:800;margin-top:2px;}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px;}
.qty button{width:28px;height:28px;border-radius:6px;background:var(--cz);font-weight:900;font-size:16px;color:var(--pt);border:1px solid var(--cz2);}
.qty span{min-width:24px;text-align:center;font-weight:800;}
.rm{margin-left:auto;background:transparent;color:var(--vm);font-size:11px;font-weight:700;text-decoration:underline;}
.cart-empty{text-align:center;color:var(--cz3);padding:40px 20px;font-weight:600;}
.cart-ft{border-top:2px solid var(--cz2);padding:16px;background:#fff;}
.tot-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:#52525b;}
.tot-line.big{font-size:19px;font-weight:900;color:var(--pt);margin-top:6px;}
.btn-primary{width:100%;background:var(--vm);color:#fff;font-weight:800;padding:14px;border-radius:8px;font-size:15px;margin-top:10px;}
.btn-primary:active{background:var(--vm2);}
.btn-ghost{width:100%;background:#fff;color:var(--pt);border:2px solid var(--pt);font-weight:800;padding:12px;border-radius:8px;font-size:14px;margin-top:8px;}
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:0;}
.modal.on{display:flex;}
.modal-in{background:#fff;width:100%;max-width:560px;min-height:100%;padding:0 0 40px;}
@media(min-width:600px){.modal{padding:20px;}.modal-in{min-height:auto;border-radius:14px;overflow:hidden;}}
.modal-hd{background:var(--pt);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2;}
.modal-hd h2{font-size:17px;flex:1;font-weight:800;}
.modal-bd{padding:16px;}
.sec-t{font-size:13px;font-weight:800;text-transform:uppercase;color:var(--vm);margin:18px 0 10px;letter-spacing:.5px;}
.sec-t:first-child{margin-top:0;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#3f3f46;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--cz2);border-radius:8px;font-weight:500;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--vm);}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.toggle{display:flex;border:2px solid var(--pt);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.toggle button{flex:1;padding:11px;background:#fff;font-weight:800;font-size:13px;color:var(--pt);}
.toggle button.on{background:var(--pt);color:#fff;}
.btn-cnpj{background:var(--pt);color:#fff;font-weight:700;padding:11px 14px;border-radius:8px;font-size:13px;white-space:nowrap;}
.hint{font-size:11px;color:var(--cz3);margin-top:4px;font-weight:600;}
.radio-grp{display:flex;flex-direction:column;gap:8px;}
.radio-opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--cz2);border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer;}
.radio-opt.on{border-color:var(--vm);background:#fff5f5;}
.radio-opt input{width:auto;}
.pix-box{background:var(--cz);border:1.5px dashed var(--cz3);border-radius:10px;padding:14px;margin-top:12px;text-align:center;}
.pix-box canvas,.pix-box img.qr{margin:0 auto 10px;display:block;}
.pix-code{font-family:monospace;font-size:10.5px;word-break:break-all;background:#fff;padding:10px;border-radius:6px;border:1px solid var(--cz2);max-height:90px;overflow-y:auto;text-align:left;}
.copy-btn{background:var(--pt);color:#fff;font-weight:700;padding:9px 14px;border-radius:7px;font-size:12.5px;margin-top:8px;}
.resumo{background:var(--cz);border-radius:10px;padding:12px;font-size:13px;}
.resumo .rl{display:flex;justify-content:space-between;padding:3px 0;}
.resumo .rl.b{font-weight:900;font-size:16px;border-top:1px solid var(--cz2);margin-top:6px;padding-top:8px;}
.send-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.send-row button,.send-row a{flex:1;min-width:130px;text-align:center;text-decoration:none;padding:13px;border-radius:8px;font-weight:800;font-size:14px;}
.s-mail{background:var(--vm);color:#fff;}
.s-wa{background:#25D366;color:#fff;}
.s-copy{background:var(--pt);color:#fff;}
footer{background:var(--pt);color:var(--cz3);padding:24px 16px;text-align:center;font-size:12px;line-height:1.7;margin-top:20px;}
footer .selo{position:static;display:inline-block;margin-bottom:10px;}
footer a{color:#fff;text-decoration:none;}
.warn-cartao{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:8px;padding:10px;font-size:12px;font-weight:600;margin-top:10px;}

.tema-fx{position:fixed;top:12px;right:12px;z-index:9999;width:42px;height:42px;border-radius:50%;

.tema-fx:hover{transform:scale(1.06)}
html.escuro .tema-fx{background:rgba(28,28,28,.92);border-color:rgba(255,255,255,.22)}
html.escuro .tema-fx .i-lua{display:none}html.escuro .tema-fx .i-sol{display:inline}
html.claro  .tema-fx .i-sol{display:none}html.claro  .tema-fx .i-lua{display:inline}
@media print{.tema-fx{display:none!important}}

@media screen{
 html.escuro{--cz:#0c0c0c!important;--tx:#e6e6e6!important;--cz2:#1d1d1d!important;--cz3:#8a8a8a!important}
 html.escuro body{background:#0c0c0c!important;color:#e6e6e6!important}
 html.escuro .card,html.escuro .card-body{background:#151515!important;color:#e6e6e6!important}
 html.escuro img.foto,html.escuro .card img{background:#fff}
 html.escuro input,html.escuro select,html.escuro textarea{background:#1d1d1d!important;color:#fff!important}
 html.escuro h1,html.escuro h2,html.escuro h3{color:#fff!important}
}

</script><script>
let CART={}, filterCat='all', query='';
const $=s=>document.querySelector(s);
const fmt=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const priceOf=code=>(PRECOS[code]||0);
const vistaOf=code=>{const p=priceOf(code);return p?Math.round(p*(1-CONFIG.descontoVista)*100)/100:0;};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function phImg(code){return '<div class="ph"><span class="selo">'+esc(CONFIG.selo)+'</span><span class="phcode">'+esc(code)+'</span><span style="font-size:10px;color:#888">Foto sob consulta</span></div>';}
window.PH=phImg;
function initChrome(){
  $('#logo').src=LOGO_SRC;
  $('#seloTop').textContent=CONFIG.selo; $('#seloFt').textContent=CONFIG.selo;
  $('#hdrLinks').innerHTML='<a href="'+esc(CONFIG.siteDistribuidor)+'" target="_blank">'+esc(CONFIG.distribuidor)+'</a><br>'+esc(CONFIG.marca);
  $('#ftInfo').innerHTML='<b style="color:#fff">'+esc(CONFIG.marca)+'</b> — distribuído por '+esc(CONFIG.distribuidor)+'<br>WhatsApp: '+esc(CONFIG.whatsapp)+' · '+esc(CONFIG.emailValidacao)+'<br><a href="'+esc(CONFIG.siteOficial)+'" target="_blank">'+esc(CONFIG.siteOficial)+'</a><br>Fluxo: Cliente envia → Validação → Financeiro/link → Pagamento/PIX → NF-e → Entrega<br><span style="font-size:10px">Especificações e imagens de referência do fabricante. Modelos e disponibilidade sujeitos a confirmação.</span>';
  if(!CONFIG.demo) $('#avisoDemo').style.display='none';
}
function initChips(){
  const cats=[...new Set(PRODUCTS.map(p=>p.category))];
  let html='<button class="chip active" data-c="all">Todos</button>';
  cats.forEach(c=>html+='<button class="chip" data-c="'+esc(c)+'">'+esc(c)+'</button>');
  $('#chips').innerHTML=html;
  $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filterCat=b.dataset.c;$('#chips').querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();});
}
function matches(p){
  if(filterCat!=='all'&&p.category!==filterCat)return false;
  if(query){const q=query.toLowerCase();const hay=(p.code+' '+p.category+' '+p.engine+' '+(p.rawSpecs||[]).join(' ')).toLowerCase();if(!hay.includes(q))return false;}
  return true;
}
function specLines(p){
  const s=p.specs,out=[];
  if(s.opWeight)out.push('Peso op.: '+s.opWeight);
  if(s.power)out.push('Potência: '+s.power);
  if(s.digDepth)out.push('Prof. escav.: '+s.digDepth);
  if(s.bucket)out.push('Caçamba: '+s.bucket);
  if(s.engine&&s.engine!=='—')out.push('Motor: '+s.engine);
  return out.slice(0,4).map(x=>'<div>'+esc(x)+'</div>').join('');
}
function render(){
  const list=PRODUCTS.filter(matches);
  $('#countInfo').textContent=list.length+' de '+PRODUCTS.length+' modelos';
  $('#grid').innerHTML=list.map(p=>{
    const pr=priceOf(p.code),pv=vistaOf(p.code),inCart=CART[p.code]?'in':'';
    const priceHtml=pr?'<div class="p-vista">'+fmt(pv)+' <small>à vista -5%</small></div><div class="p-prazo">a prazo: <s>'+fmt(pr)+'</s> (cheio)</div>':'<div class="no-price">Preço sob consulta</div>';
    const img=p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.code)+'" loading="lazy" onerror="this.parentNode.innerHTML=PH(this.dataset.c)" data-c="'+esc(p.code)+'">':phImg(p.code);
    return '<div class="card"><div class="card-img"><span class="cat-tag">'+esc(p.category)+'</span>'+img+'</div><div class="card-body"><div class="card-cat">'+esc(p.category)+'</div><div class="card-name">'+esc(p.code)+'</div><div class="card-code">Ref. fabricante: '+esc(p.rippaRef||'')+(p.variant?(' · '+esc(p.variant)):'')+'</div><div class="card-specs">'+specLines(p)+'</div><div class="prices">'+priceHtml+'</div><button class="add '+inCart+'" data-code="'+esc(p.code)+'">'+(inCart?'✓ No pedido':'+ Adicionar')+'</button></div></div>';
  }).join('')||'<div style="padding:40px;text-align:center;color:#999;grid-column:1/-1">Nenhum modelo encontrado.</div>';
  $('#grid').querySelectorAll('.add').forEach(b=>b.onclick=()=>addToCart(b.dataset.code));
}
</script><script>
function addToCart(code){CART[code]=(CART[code]||0)+1;syncCart();openCart();}
function setQty(code,d){CART[code]=(CART[code]||0)+d;if(CART[code]<=0)delete CART[code];syncCart();}
function removeItem(code){delete CART[code];syncCart();}
function cartCount(){return Object.values(CART).reduce((a,b)=>a+b,0);}
function cartTotals(){let prazo=0,vista=0,hasNoPrice=false;for(const c in CART){const pr=priceOf(c);if(!pr){hasNoPrice=true;continue;}prazo+=pr*CART[c];vista+=vistaOf(c)*CART[c];}return{prazo,vista,hasNoPrice};}
function syncCart(){render();const n=cartCount();$('#fabBadge').style.display=n?'flex':'none';$('#fabBadge').textContent=n;renderCart();}
function openCart(){$('#cart').classList.add('on');$('#overlay').classList.add('on');}
function closeCart(){$('#cart').classList.remove('on');$('#overlay').classList.remove('on');}
function renderCart(){
  const codes=Object.keys(CART);
  if(!codes.length){$('#cartItems').innerHTML='<div class="cart-empty">Seu pedido está vazio.<br>Adicione máquinas do catálogo.</div>';$('#cartFt').innerHTML='';return;}
  $('#cartItems').innerHTML=codes.map(c=>{
    const p=PRODUCTS.find(x=>x.code===c),pr=priceOf(c),pv=vistaOf(c);
    const img=p.img?'<img src="'+esc(p.img)+'" onerror="this.style.display=\'none\'">':'';
    return '<div class="ci">'+img+'<div class="ci-b"><div class="ci-name">'+esc(p.code)+'</div><div class="ci-code">'+esc(p.category)+(p.variant?(' · '+esc(p.variant)):'')+'</div><div class="ci-price">'+(pr?fmt(pv)+' <span style="font-weight:500;color:#999">à vista</span>':'<span style="color:#D60D20">Sob consulta</span>')+'</div><div class="qty"><button onclick="setQty(\''+c+'\',-1)">−</button><span>'+CART[c]+'</span><button onclick="setQty(\''+c+'\',1)">+</button><button class="rm" onclick="removeItem(\''+c+'\')">remover</button></div></div></div>';
  }).join('');
  const t=cartTotals();
  $('#cartFt').innerHTML='<div class="tot-line"><span>Total a prazo (cheio)</span><b>'+fmt(t.prazo)+'</b></div><div class="tot-line"><span>Desconto à vista (5%)</span><b style="color:#16a34a">- '+fmt(t.prazo-t.vista)+'</b></div><div class="tot-line big"><span>Total à vista</span><span>'+fmt(t.vista)+'</span></div>'+(t.hasNoPrice?'<div class="warn-cartao">Alguns itens estão "sob consulta" e não entram no total. O vendedor confirmará os valores.</div>':'')+'<button class="btn-primary" onclick="openModal()">Finalizar Pedido</button><button class="btn-ghost" onclick="closeCart()">Continuar comprando</button>';
}
function crc16(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF;}}return crc.toString(16).toUpperCase().padStart(4,'0');}
function tlv(id,val){return id+String(val.length).padStart(2,'0')+val;}
function normalizePix(s,max){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .,-]/g,'').toUpperCase().slice(0,max).trim();}
function buildPix(valor){
  const gui=tlv('00','BR.GOV.BCB.PIX'),key=tlv('01',String(CONFIG.pixChave));
  let p=tlv('00','01')+tlv('26',gui+key)+tlv('52','0000')+tlv('53','986')+(valor>0?tlv('54',valor.toFixed(2)):'')+tlv('58','BR')+tlv('59',normalizePix(CONFIG.pixNome,25)||'RECEBEDOR')+tlv('60',normalizePix(CONFIG.pixCidade,15)||'CIDADE')+tlv('62',tlv('05','***'));
  p+='6304';return p+crc16(p);
}
</script><script>
let tipoPessoa='PJ', pagamento='vista';
function openModal(){if(!cartCount())return;buildModal();$('#modal').classList.add('on');$('#overlay').classList.add('on');$('#modal').scrollTop=0;}
function closeModal(){$('#modal').classList.remove('on');if(!$('#cart').classList.contains('on'))$('#overlay').classList.remove('on');}
function buildModal(){
  $('#modalBd').innerHTML=`
  <div class="toggle"><button class="${tipoPessoa==='PJ'?'on':''}" onclick="setTipo('PJ')">Pessoa Jurídica</button><button class="${tipoPessoa==='PF'?'on':''}" onclick="setTipo('PF')">Pessoa Física</button></div>
  <div id="pjBlock" style="display:${tipoPessoa==='PJ'?'block':'none'}"><div class="sec-t">Dados da Empresa</div>
    <div class="field"><label>CNPJ</label><div class="row" style="align-items:stretch"><input id="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" oninput="maskCNPJ(this)"><button class="btn-cnpj" style="flex:0 0 auto" onclick="puxarReceita()">Puxar da Receita</button></div><div class="hint" id="cnpjStatus">Preenche automaticamente razão social e endereço.</div></div>
    <div class="field"><label>Razão Social</label><input id="razao"></div>
    <div class="field"><label>Inscrição Estadual (opcional)</label><input id="ie"></div></div>
  <div id="pfBlock" style="display:${tipoPessoa==='PF'?'block':'none'}"><div class="sec-t">Dados Pessoais</div>
    <div class="field"><label>Nome completo</label><input id="nomePF"></div>
    <div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" placeholder="000.000.000-00" oninput="maskCPF(this)"><div class="hint">Sem consulta automática (LGPD). Preencha manualmente.</div></div></div>
  <div class="sec-t">Endereço & Contato</div>
  <div class="field"><label>Endereço</label><input id="end" placeholder="Rua, número, complemento"></div>
  <div class="row"><div class="field"><label>Cidade</label><input id="cidade"></div><div class="field" style="flex:0 0 90px"><label>UF</label><input id="uf" maxlength="2" style="text-transform:uppercase"></div></div>
  <div class="row"><div class="field"><label>CEP</label><input id="cep" inputmode="numeric" placeholder="00000-000" oninput="maskCEP(this)"></div><div class="field"><label>Telefone/WhatsApp</label><input id="fone" inputmode="numeric" placeholder="(00) 00000-0000" oninput="maskFone(this)"></div></div>
  <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@empresa.com" oninput="refreshResumo()"></div>
  <div class="field"><label>Vendedor (se houver)</label><input id="vendedor"></div>
  <div class="sec-t">Forma de Pagamento</div>
  <div class="radio-grp"><label class="radio-opt ${pagamento==='vista'?'on':''}" onclick="setPag('vista')"><input type="radio" name="pag" ${pagamento==='vista'?'checked':''}> À vista — PIX / dinheiro / débito / crédito à vista <b style="color:#16a34a;margin-left:auto">-5%</b></label><label class="radio-opt ${pagamento==='parcelado'?'on':''}" onclick="setPag('parcelado')"><input type="radio" name="pag" ${pagamento==='parcelado'?'checked':''}> Parcelado — cartão parcelado ou boleto <b style="margin-left:auto">valor cheio</b></label></div>
  <div id="parcelaBox" style="display:${pagamento==='parcelado'?'block':'none'};margin-top:12px"><div class="row"><div class="field"><label>Nº de parcelas</label><select id="parcelas" onchange="refreshResumo()"><option value="1">1x</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>10</option><option>12</option></select></div><div class="field"><label>1º vencimento</label><input id="venc" type="date" onchange="refreshResumo()"></div></div><div class="warn-cartao">Cartão parcelado: o link de pagamento (Sicredi/Itaú) é enviado manualmente pelo financeiro. Não é automatizado aqui.</div></div>
  <div id="pixArea"></div>
  <div class="sec-t">Resumo do Pedido</div><div class="resumo" id="resumo"></div>
  <div class="send-row"><a class="s-mail" id="btnMail" href="#">✉️ Enviar por E-mail</a><a class="s-wa" id="btnWa" target="_blank" href="#">💬 WhatsApp</a><button class="s-copy" onclick="copyPedido()">📋 Copiar</button></div>
  <div class="hint" style="margin-top:8px">O e-mail vai para ${esc(CONFIG.emailValidacao)} com você em cópia. Fluxo: Validação → Financeiro → Pagamento → NF-e → Entrega.</div>`;
  refreshResumo();
}
function setTipo(t){tipoPessoa=t;buildModal();}
function setPag(p){pagamento=p;buildModal();}
function maskCNPJ(el){let v=el.value.replace(/\D/g,'').slice(0,14);v=v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');el.value=v;}
function maskCPF(el){let v=el.value.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})(\d{1,2})$/,'$1-$2');el.value=v;}
function maskCEP(el){let v=el.value.replace(/\D/g,'').slice(0,8);v=v.replace(/(\d{5})(\d)/,'$1-$2');el.value=v;}
function maskFone(el){let v=el.value.replace(/\D/g,'').slice(0,11);if(v.length>10)v=v.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3');else v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');el.value=v;}
</script><script>
async function puxarReceita(){
  const raw=($('#cnpj').value||'').replace(/\D/g,''),st=$('#cnpjStatus');
  if(raw.length!==14){st.textContent='Informe um CNPJ com 14 dígitos.';st.style.color='#D60D20';return;}
  st.textContent='Consultando...';st.style.color='#71717a';
  const sources=[
    {u:'https://brasilapi.com.br/api/cnpj/v1/'+raw,m:d=>({razao:d.razao_social||d.nome_fantasia,end:[d.logradouro,d.numero,d.complemento].filter(Boolean).join(', '),cidade:d.municipio,uf:d.uf,cep:d.cep})},
    {u:'https://publica.cnpj.ws/cnpj/'+raw,m:d=>({razao:d.razao_social,end:[d.estabelecimento&&d.estabelecimento.logradouro,d.estabelecimento&&d.estabelecimento.numero].filter(Boolean).join(', '),cidade:d.estabelecimento&&d.estabelecimento.cidade&&d.estabelecimento.cidade.nome,uf:d.estabelecimento&&d.estabelecimento.estado&&d.estabelecimento.estado.sigla,cep:d.estabelecimento&&d.estabelecimento.cep})},
    {u:'https://open.cnpja.com/office/'+raw,m:d=>({razao:d.company&&d.company.name,end:[d.address&&d.address.street,d.address&&d.address.number].filter(Boolean).join(', '),cidade:d.address&&d.address.city,uf:d.address&&d.address.state,cep:d.address&&d.address.zip})}
  ];
  for(const s of sources){try{const r=await fetch(s.u);if(!r.ok)continue;const d=await r.json();const o=s.m(d);if(o.razao){$('#razao').value=o.razao||'';$('#end').value=o.end||'';$('#cidade').value=o.cidade||'';$('#uf').value=(o.uf||'').toUpperCase();if(o.cep)$('#cep').value=String(o.cep).replace(/\D/g,'').replace(/(\d{5})(\d)/,'$1-$2');st.textContent='✓ Dados carregados da Receita.';st.style.color='#16a34a';refreshResumo();return;}}catch(e){}}
  st.textContent='Não foi possível consultar automaticamente. Preencha manualmente.';st.style.color='#D60D20';
}
function drawQR(text,container){
  container.innerHTML='';
  const load=(src,cb)=>{const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>cb(true);document.head.appendChild(s);};
  function useLib(){
    if(window.QRCode){try{const div=document.createElement('div');container.appendChild(div);new QRCode(div,{text:text,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});return;}catch(e){}}
    const img=document.createElement('img');img.className='qr';img.width=170;img.height=170;img.src='https://api.qrserver.com/v1/create-qr-code/?size=170x170&data='+encodeURIComponent(text);img.onerror=()=>{container.innerHTML='<div class="hint">QR indisponível offline — use o código copia-e-cola abaixo.</div>';};container.appendChild(img);
  }
  if(window.QRCode)useLib();else load('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js',()=>useLib());
}
function refreshResumo(){
  const t=cartTotals();
  const parc=pagamento==='parcelado'?(parseInt($('#parcelas')&&$('#parcelas').value)||1):1;
  const total=pagamento==='vista'?t.vista:t.prazo;
  let itens=Object.keys(CART).map(c=>{const p=PRODUCTS.find(x=>x.code===c);const pr=priceOf(c);const u=pagamento==='vista'?vistaOf(c):pr;return{q:CART[c],nome:p.code,u,sub:u*CART[c],semp:!pr};});
  $('#resumo').innerHTML=itens.map(i=>'<div class="rl"><span>'+i.q+'x '+esc(i.nome)+'</span><span>'+(i.semp?'sob consulta':fmt(i.sub))+'</span></div>').join('')+'<div class="rl"><span>Pagamento</span><span>'+(pagamento==='vista'?'À vista (-5%)':'Parcelado '+parc+'x')+'</span></div>'+(pagamento==='parcelado'&&parc>1?'<div class="rl"><span>Valor por parcela</span><span>'+fmt(total/parc)+'</span></div>':'')+'<div class="rl b"><span>TOTAL</span><span>'+fmt(total)+'</span></div>';
  const pixArea=$('#pixArea');
  if(pagamento==='vista'&&total>0){const code=buildPix(total);pixArea.innerHTML='<div class="sec-t">Pagamento via PIX (à vista)</div><div class="pix-box"><div id="qrBox"></div><div class="pix-code" id="pixCode">'+esc(code)+'</div><button class="copy-btn" onclick="copyPix(event)">📋 Copiar código PIX</button><div class="hint" style="margin-top:6px">Recebedor: '+esc(CONFIG.pixNome)+' · '+esc(CONFIG.pixCidade)+' · Valor: '+fmt(total)+'</div></div>';drawQR(code,$('#qrBox'));}else{pixArea.innerHTML='';}
  updateSendLinks(total,parc);
}
function copyPix(ev){const c=$('#pixCode').textContent;navigator.clipboard&&navigator.clipboard.writeText(c);const b=ev.target,o=b.textContent;b.textContent='✓ Copiado!';setTimeout(()=>b.textContent=o,1500);}
</script><script>
function pedidoTexto(total,parc){
  const t=cartTotals(),g=id=>($('#'+id)?$('#'+id).value.trim():'');
  let L=[];
  L.push('*PEDIDO — '+CONFIG.marca+'*');L.push('Distribuidor: '+CONFIG.distribuidor);L.push('Selo: '+CONFIG.selo);L.push('');
  L.push('*Cliente*');
  if(tipoPessoa==='PJ'){L.push('Tipo: Pessoa Jurídica');L.push('CNPJ: '+g('cnpj'));L.push('Razão Social: '+g('razao'));if(g('ie'))L.push('IE: '+g('ie'));}
  else{L.push('Tipo: Pessoa Física');L.push('Nome: '+g('nomePF'));L.push('CPF: '+g('cpf'));}
  L.push('Endereço: '+g('end'));L.push('Cidade/UF: '+g('cidade')+'/'+g('uf').toUpperCase()+'  CEP: '+g('cep'));L.push('Telefone: '+g('fone'));L.push('E-mail: '+g('email'));if(g('vendedor'))L.push('Vendedor: '+g('vendedor'));L.push('');
  L.push('*Itens*');
  Object.keys(CART).forEach(c=>{const p=PRODUCTS.find(x=>x.code===c);const pr=priceOf(c);const u=pagamento==='vista'?vistaOf(c):pr;L.push('• '+CART[c]+'x '+p.code+' ('+p.category+(p.variant?(' - '+p.variant):'')+') — '+(pr?fmt(u)+'/un = '+fmt(u*CART[c]):'sob consulta'));});
  L.push('');
  L.push('*Pagamento:* '+(pagamento==='vista'?'À vista (-5%)':'Parcelado '+parc+'x'+(g('venc')?' · 1º venc: '+g('venc'):'')));
  if(pagamento==='parcelado')L.push('(Cartão: link Sicredi/Itaú enviado manualmente pelo financeiro)');
  L.push('*TOTAL:* '+fmt(total));
  if(pagamento==='vista'&&total>0){L.push('');L.push('*PIX copia-e-cola:*');L.push(buildPix(total));L.push('Recebedor: '+CONFIG.pixNome+' — '+CONFIG.pixCidade);}
  if(t.hasNoPrice)L.push('\n(Itens "sob consulta" não somados — aguardando confirmação de valores.)');
  L.push('');L.push('Fluxo: Cliente envia → Validação → Financeiro/link → Pagamento/PIX → NF-e → Entrega');
  return L.join('\n');
}
function updateSendLinks(total,parc){
  const txt=pedidoTexto(total,parc);
  const email=($('#email')?$('#email').value.trim():'');
  const assunto='Pedido '+CONFIG.marca+' — '+(tipoPessoa==='PJ'?(($('#razao')&&$('#razao').value)||'PJ'):(($('#nomePF')&&$('#nomePF').value)||'PF'));
  const cc=email?'&cc='+encodeURIComponent(email):'';
  if($('#btnMail'))$('#btnMail').href='mailto:'+encodeURIComponent(CONFIG.emailValidacao)+'?subject='+encodeURIComponent(assunto)+cc+'&body='+encodeURIComponent(txt);
  if($('#btnWa'))$('#btnWa').href='https://wa.me/'+CONFIG.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(txt);
  window.__PEDIDO_TXT=txt;
}
function copyPedido(){navigator.clipboard&&navigator.clipboard.writeText(window.__PEDIDO_TXT||'');event.target.textContent='✓ Copiado!';setTimeout(()=>{event.target.textContent='📋 Copiar';},1500);}
function resetOrder(){CART={};filterCat='all';query='';if($('#search'))$('#search').value='';syncCart();}
document.addEventListener('DOMContentLoaded',()=>{
  initChrome();initChips();render();syncCart();
  $('#search').addEventListener('input',e=>{query=e.target.value;render();});
  $('#fab').onclick=openCart;$('#closeCart').onclick=closeCart;$('#closeModal').onclick=closeModal;
  $('#overlay').onclick=()=>{closeCart();closeModal();};
});
window.addEventListener('pageshow',e=>{if(e.persisted){resetOrder();closeCart();closeModal();}});
window.addEventListener('beforeunload',()=>{CART={};});
</script>
</body></html>
