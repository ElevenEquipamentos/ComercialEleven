<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eleven — Gerador de Contratos</title>
<style>
/* ============================================================
   PALETA ELEVEN — Manual da Marca (v1 · Junho 2026)
   #000000 · #D60D20 · #FFFFFF · #686868 · #B4B4B4
   Tipografia: Montserrat (ExtraBold títulos / Regular textos)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
:root{
  --azul-escuro:#000000;   /* preto institucional (títulos, cabeçalhos) */
  --azul-medio:#686868;    /* cinza institucional */
  --laranja:#D60D20;       /* vermelho Eleven (destaque / acento) */
  --laranja-claro:#FBE7E9; /* vermelho suave (fundos) */
  --cinza-texto:#2B2B2B;
  --cinza-claro:#F5F5F5;
  --cinza-medio:#B4B4B4;
  --borda:#E3E3E3;
  --branco:#FFFFFF;
  --fonte-titulo:'Montserrat','Segoe UI',Arial,sans-serif;
  --fonte-texto:'Montserrat','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--fonte-texto);
  background:var(--cinza-claro);
  color:var(--cinza-texto);
  display:flex;
  min-height:100vh;
}

/* ===================== PAINEL DO FORMULÁRIO ===================== */
#painel{
  width:400px;min-width:400px;
  background:var(--branco);
  border-right:1px solid var(--borda);
  height:100vh;overflow-y:auto;
  padding:0 0 40px 0;
}
#painel header{
  background:var(--azul-escuro);
  color:#fff;padding:20px 22px;
  position:sticky;top:0;z-index:5;
}
#painel header .logo{display:flex;align-items:center;gap:12px}
#painel header .logo img{height:38px;display:block}
#painel header .logo span{
  font-family:var(--fonte-titulo);font-weight:400;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;opacity:.85;
  border-left:2px solid var(--laranja);padding-left:12px;
}
.secao{padding:18px 22px 4px 22px}
.secao h3{
  font-family:var(--fonte-titulo);
  font-size:12px;text-transform:uppercase;letter-spacing:1px;
  color:var(--azul-medio);
  border-bottom:2px solid var(--laranja);
  display:inline-block;padding-bottom:4px;margin-bottom:12px;
}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:11.5px;font-weight:600;color:var(--azul-escuro);margin-bottom:3px}
.campo input,.campo select,.campo textarea{
  width:100%;padding:8px 10px;
  border:1px solid var(--borda);border-radius:8px;
  font-family:var(--fonte-texto);font-size:13px;color:var(--cinza-texto);
  background:#fff;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:none;border-color:var(--laranja);
  box-shadow:0 0 0 3px var(--laranja-claro);
}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
textarea{resize:vertical;min-height:60px}

.btn-buscar{padding:8px 13px;border:none;border-radius:8px;background:var(--azul-escuro);color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px;cursor:pointer;font-family:var(--fonte-titulo);flex-shrink:0}
.btn-buscar:hover{background:var(--laranja)}
.btn-buscar:disabled{background:var(--cinza-medio,#B4B4B4);cursor:wait}

/* equipamentos */
.equip{
  border:1px solid var(--borda);border-radius:10px;
  padding:10px;margin-bottom:10px;background:#FBFCFE;position:relative;
}
.equip .remover{
  position:absolute;top:6px;right:8px;
  background:none;border:none;color:#C0392B;cursor:pointer;
  font-size:15px;font-weight:700;line-height:1;
}
.btn-add{
  width:100%;padding:9px;border:1.5px dashed var(--laranja);
  background:var(--laranja-claro);color:var(--azul-escuro);
  border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;
  font-family:var(--fonte-titulo);
}
.btn-add:hover{background:#F6D2D6}

/* botão gerar */
#barra-acoes{
  position:sticky;bottom:0;background:#fff;
  padding:14px 22px;border-top:1px solid var(--borda);
  display:flex;gap:10px;z-index:5;
}
#btn-pdf{
  flex:1;padding:13px;border:none;border-radius:10px;
  background:var(--laranja);color:#fff;
  font-family:var(--fonte-titulo);font-weight:800;font-size:14px;
  letter-spacing:.4px;cursor:pointer;
}
#btn-pdf:hover{background:#B00A1A}

/* ===================== ÁREA DE PREVIEW ===================== */
#preview{
  flex:1;height:100vh;overflow-y:auto;
  padding:34px 30px;display:flex;justify-content:center;
}
.folha{
  width:210mm;min-height:297mm;
  background:#fff;
  box-shadow:0 4px 28px rgba(15,42,71,.16);
  padding:20mm 18mm;
  border-radius:4px;
}

/* ===================== DOCUMENTO ===================== */
.doc-topo{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--borda);
  padding-bottom:14px;margin-bottom:16px;
}
.doc-topo .logo img{height:34px;display:block}
.doc-topo .num{
  text-align:right;font-family:var(--fonte-titulo);
  font-size:9.5px;color:var(--azul-medio);
  letter-spacing:2.5px;text-transform:uppercase;
}
.doc-topo .num b{display:block;font-size:13.5px;color:var(--azul-escuro);letter-spacing:.5px;margin-top:2px}
.doc-eyebrow{
  font-family:var(--fonte-titulo);font-weight:600;
  font-size:9.5px;color:var(--laranja);
  letter-spacing:4px;text-transform:uppercase;
  text-align:center;margin-bottom:5px;
}
.doc-titulo{
  text-align:center;font-family:var(--fonte-titulo);
  color:var(--azul-escuro);font-size:16.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;
  margin:0 0 4px 0;
}
.doc-titulo-linha{
  width:56px;height:3px;background:var(--laranja);
  margin:0 auto 16px auto;border-radius:2px;
}
.doc-partes{
  font-size:11.5px;line-height:1.55;text-align:justify;
  margin-bottom:8px;
}
.doc-partes b{color:var(--azul-escuro)}
.doc-consideranda{font-size:11.5px;text-align:justify;margin:10px 0;line-height:1.55}
.clausula{margin-top:12px}
.clausula h4{
  font-family:var(--fonte-titulo);font-size:11.5px;font-weight:800;
  color:var(--azul-escuro);text-transform:uppercase;
  letter-spacing:1.2px;margin-bottom:5px;
  border-left:3px solid var(--laranja);padding-left:8px;
}
.clausula h4 span{color:var(--laranja)}
.clausula p{font-size:11.5px;line-height:1.6;text-align:justify;margin-bottom:5px}
.clausula p.paragrafo{padding-left:14px}
table.tab-equip{
  width:100%;border-collapse:collapse;margin:8px 0;font-size:10.5px;
}
table.tab-equip th{
  background:var(--azul-escuro);color:#fff;
  font-family:var(--fonte-titulo);font-weight:700;
  padding:6px 7px;text-align:left;font-size:10px;letter-spacing:.3px;
}
table.tab-equip td{border:1px solid var(--borda);padding:6px 7px}
table.tab-equip tr:nth-child(even) td{background:var(--cinza-claro)}
.destaque-valor{
  background:var(--cinza-claro);
  border-left:4px solid var(--laranja);
  border-radius:0 8px 8px 0;
  padding:9px 12px;margin:8px 0;font-size:11.5px;line-height:1.55;
}
.destaque-valor b{color:var(--laranja)}
.assinaturas{margin-top:44px}
.data-local{font-size:11.5px;text-align:center;margin-bottom:38px}
.grade-assin{display:grid;grid-template-columns:1fr 1fr;gap:34px 40px}
.bloco-assin{text-align:center;font-size:10.5px}
.bloco-assin .linha-assin{border-top:1.4px solid var(--cinza-texto);padding-top:5px}
.bloco-assin b{font-family:var(--fonte-titulo);color:var(--azul-escuro);font-size:11px}
.doc-rodape{
  margin-top:26px;border-top:1px solid var(--borda);
  padding-top:9px;display:flex;justify-content:space-between;align-items:center;
  font-size:8.5px;color:var(--azul-medio);
  font-family:var(--fonte-titulo);letter-spacing:1.2px;text-transform:uppercase;
}
.doc-rodape .tracinho{width:34px;height:3px;background:var(--laranja);border-radius:2px}

/* ===================== IMPRESSÃO ===================== */
@media print{
  @page{size:A4;margin:14mm 13mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;display:block}
  #painel,#barra-acoes{display:none!important}
  #preview{padding:0;height:auto;overflow:visible;display:block}
  .folha{width:auto;min-height:0;box-shadow:none;padding:0;border-radius:0}
  .clausula{page-break-inside:avoid}
  .assinaturas{page-break-inside:avoid}
}
@media (max-width:900px){
  body{flex-direction:column}
  #painel{width:100%;min-width:0;height:auto}
  #preview{height:auto;padding:16px}
  .folha{width:100%}
}
</style>
<style>
.tema-fx{position:fixed;top:12px;right:12px;z-index:9999;width:42px;height:42px;border-radius:50%;
 border:1px solid rgba(128,128,128,.35);background:rgba(255,255,255,.9);cursor:pointer;font-size:19px;line-height:1;
 display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tema-fx:hover{transform:scale(1.06)}
html.escuro .tema-fx{background:rgba(28,28,28,.92);border-color:rgba(255,255,255,.22)}
html.escuro .tema-fx .i-lua{display:none}html.escuro .tema-fx .i-sol{display:inline}
html.claro  .tema-fx .i-sol{display:none}html.claro  .tema-fx .i-lua{display:inline}
@media print{.tema-fx{display:none!important}}

@media screen{
 html.escuro body{background:#0c0c0c;color:#e8e8e8}
 html.escuro #painel{background:#151515;color:#dcdcdc;border-color:#2a2a2a}
 html.escuro #painel h1,html.escuro #painel h2,html.escuro #painel h3,html.escuro #painel h4,html.escuro #painel legend,html.escuro #painel .titulo,html.escuro #painel .sec-title{color:#ffffff}
 html.escuro #painel label,html.escuro .campo label,html.escuro .grp label,html.escuro label{color:#c6c6c6}
 html.escuro input,html.escuro select,html.escuro textarea{background:#1d1d1d;color:#fff;border-color:#343434}
 html.escuro input::placeholder,html.escuro textarea::placeholder{color:#7a7a7a}
 html.escuro #preview{background:#0c0c0c}
 html.escuro #barra-acoes{background:#151515;border-color:#2a2a2a}
 html.escuro .equip,html.escuro .bloco,html.escuro .grupo,html.escuro .item,html.escuro .const,html.escuro .inv,html.escuro .topico,html.escuro .foto-item{background:#1d1d1d!important;border-color:#343434!important}
 html.escuro .btn-add{background:#2a2a2a;color:#fff}
 html.escuro .btn-buscar{background:#333;color:#fff}
 html.escuro select option{background:#1d1d1d;color:#fff}
 /* o PAPEL do documento (.folha) permanece branco, como papel real */
}
</style>
</head>
<body>
<button class="tema-fx" onclick="elevenToggleTema()" title="Modo claro / escuro" aria-label="Alternar modo claro/escuro"><span class="i-sol">&#9728;</span><span class="i-lua">&#127769;</span></button>
<script>
function elevenToggleTema(){var h=document.documentElement,dk=h.classList.contains('escuro');
  h.classList.remove('escuro','claro');h.classList.add(dk?'claro':'escuro');
  try{localStorage.setItem('elevenTema',dk?'claro':'escuro');}catch(e){}}
</script>

<script>

/* ---------- utilidades ---------- */
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function moeda(v){
  v = parseFloat(v)||0;
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
/* valor por extenso (até centenas de milhões) */
function extenso(v){
  v = Math.round((parseFloat(v)||0)*100)/100;
  var inteiro = Math.floor(v), cent = Math.round((v-inteiro)*100);
  var UN=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  var DEZ=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  var CEN=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  function trio(n){
    if(n===0) return '';
    if(n===100) return 'cem';
    var c=Math.floor(n/100), r=n%100, partes=[];
    if(c) partes.push(CEN[c]);
    if(r){
      if(r<20) partes.push(UN[r]);
      else{
        var d=Math.floor(r/10), u=r%10;
        partes.push(u? DEZ[d]+' e '+UN[u] : DEZ[d]);
      }
    }
    return partes.join(' e ');
  }
  function grupo(n,sing,plur){
    if(!n) return '';
    if(n===1) return (sing==='mil'?'mil':'um '+sing);
    return trio(n)+' '+plur;
  }
  var milhoes=Math.floor(inteiro/1000000), milhares=Math.floor((inteiro%1000000)/1000), resto=inteiro%1000;
  var partes=[];
  if(milhoes) partes.push(milhoes===1?'um milhão':trio(milhoes)+' milhões');
  if(milhares) partes.push(milhares===1?'mil':trio(milhares)+' mil');
  if(resto) partes.push(trio(resto));
  var txt = partes.length? partes.join(partes.length>1 && resto && resto<100 && !milhares? ' e ':' e ') : 'zero';
  txt += (inteiro===1?' real':' reais');
  if(cent) txt += ' e '+trio(cent)+(cent===1?' centavo':' centavos');
  return txt;
}
function dataExtenso(iso){
  if(!iso) return '____ de ______________ de ______';
  var meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var p=iso.split('-');
  return parseInt(p[2],10)+' de '+meses[parseInt(p[1],10)-1]+' de '+p[0];
}
var ORDINAIS=['PRIMEIRA','SEGUNDA','TERCEIRA','QUARTA','QUINTA','SEXTA','SÉTIMA','OITAVA','NONA','DÉCIMA','DÉCIMA PRIMEIRA','DÉCIMA SEGUNDA','DÉCIMA TERCEIRA','DÉCIMA QUARTA','DÉCIMA QUINTA','DÉCIMA SEXTA'];

function val(id){ var el=document.getElementById(id); return el? el.value.trim() : ''; }
function ph(v,padrao){ return v? esc(v) : '<u>'+(padrao||'________________')+'</u>'; }

/* ---------- consulta de CNPJ (BrasilAPI / Receita Federal) ---------- */
function setIf(id,v){if(v)document.getElementById(id).value=v}
function fmtCnpj(d){return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5')}
document.getElementById('btn-cnpj').addEventListener('click',function(){
  var raw=val('ctCnpj').replace(/\D/g,'');
  var btn=this;
  if(raw.length!==14){alert('Informe um CNPJ válido (14 dígitos) para buscar. Para CPF, preencha manualmente.');return}
  btn.disabled=true;btn.textContent='...';
  fetch('https://brasilapi.com.br/api/cnpj/v1/'+raw)
    .then(function(r){if(!r.ok)throw new Error('CNPJ não encontrado na base da Receita');return r.json()})
    .then(function(d){
      document.getElementById('ctCnpj').value=fmtCnpj(raw);
      setIf('ctRazao',d.razao_social);
      var log=[d.descricao_tipo_de_logradouro,d.logradouro].filter(Boolean).join(' ');
      var cep=d.cep?String(d.cep).replace(/^(\d{5})(\d{3})$/,'$1-$2'):'';
      setIf('ctEnd',[log,d.numero,d.complemento,d.bairro,cep?'CEP '+cep:''].filter(Boolean).join(', '));
      if(d.municipio)setIf('ctCidade',d.municipio+(d.uf?'/'+d.uf:''));
      render();
    })
    .catch(function(e){alert('Não foi possível consultar o CNPJ: '+e.message+'.\nVerifique a conexão com a internet ou preencha manualmente.')})
    .finally(function(){btn.disabled=false;btn.textContent='Buscar'});
});

  function prefillFromProposta(){
    var raw; try{ raw=localStorage.getItem('eleven_proposta'); }catch(e){ return; }
    if(!raw) return;
    var p; try{ p=JSON.parse(raw); }catch(e){ return; }
    var c=p.cliente||{}, eq=p.equipamento||{}, v=p.valores||{}, pr=p.proposta||{};
    window._elevenPropostaImported=true;
    var sel=document.getElementById('tipo'); if(sel){ sel.value='venda'; }
    setIf('ctRazao', c.razao); setIf('ctCnpj', c.cnpj);
    setIf('ctCidade', (c.cidade && c.uf) ? (c.cidade+'/'+c.uf) : (c.cidade||''));
    setIf('ctEnd', [c.endereco, c.cep].filter(Boolean).join(' - '));
    setIf('ctRep', c.contato); setIf('ctCargo', c.cargo);
    if(v.total){ setIf('vlValor', String(v.total)); }
    setIf('vlPagamento', v.pagamento);
    if(v.garantia){ var g=String(v.garantia).match(/\d+/); if(g) setIf('garantiaMeses', g[0]); }
    if(pr.cidade){ setIf('cidadeAssin', pr.cidade); }
    if(eq.modelo || eq.marca || eq.capacidade){
      addEquip({ tipo: eq.tipo, marca: eq.marca });
      var last=document.querySelector('#lista-equip .equip:last-child');
      if(last){
        if(last.querySelector('.eq-modelo')) last.querySelector('.eq-modelo').value=eq.modelo||'';
        if(eq.ano && last.querySelector('.eq-ano')) last.querySelector('.eq-ano').value=eq.ano;
        if(eq.serie && last.querySelector('.eq-serie')) last.querySelector('.eq-serie').value=eq.serie;
        if(last.querySelector('.eq-cap')) last.querySelector('.eq-cap').value=eq.capacidade||'';
      }
    }
    render();
    var banner=document.createElement('div');
    banner.style.cssText='background:#FBE7E9;border-left:4px solid #D60D20;padding:10px 12px;border-radius:6px;font-size:12px;color:#2B2B2B;margin-bottom:14px;';
    banner.innerHTML='✔ Dados importados da <b>proposta</b>. Confira e complete o que faltar antes de enviar para validação.';
    var painel=document.getElementById('painel'); if(painel) painel.insertBefore(banner, painel.firstChild);
  }
  if(/[?&]from=proposta/.test(location.search)){ try{ prefillFromProposta(); }catch(e){ console.warn('prefill',e); } }

  var btn=document.getElementById('btn-enviar-adm');
  var status=document.getElementById('envio-status');
  if(btn) btn.addEventListener('click', function(){
    var docEl=document.getElementById('documento');
    var texto=docEl?(docEl.innerText||'').trim():'';
    if(!texto || texto.length<50){ status.style.color='#D60D20'; status.textContent='Preencha o contrato antes de enviar.'; return; }
    btn.disabled=true; status.style.color='#686868'; status.textContent='Enviando…';
    var payload={
      _subject:'Contrato p/ validação — '+(val('numContrato')||'s/nº')+' — '+(val('ctRazao')||'cliente'),
      _template:'box',
      'Nº do Contrato':val('numContrato'),
      'Tipo':(document.getElementById('tipo')||{}).value||'',
      'Cliente':val('ctRazao'),
      'CNPJ':val('ctCnpj'),
      'Cidade/UF':val('ctCidade'),
      'Representante':val('ctRep')+' ('+val('ctCargo')+')',
      'Valor':val('vlValor'),
      'Pagamento':val('vlPagamento'),
      'Garantia (meses)':val('garantiaMeses'),
      'CONTRATO (texto completo)':texto
    };
    fetch('https://formsubmit.co/ajax/adm@comercialeleven.com',{
      method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(res){
      btn.disabled=false;
      if(res && (res.success===true || res.success==='true')){
        status.style.color='#1faf54'; status.innerHTML='✔ Enviado para <b>adm@comercialeleven.com</b>. Baixe o PDF e aguarde a devolução assinada.';
      }else{
        status.style.color='#D60D20'; status.textContent='Não confirmado. Se for o 1º envio, confirme o e-mail do FormSubmit na sua caixa. Você também pode imprimir e anexar manualmente.';
      }
    }).catch(function(){
      btn.disabled=false; status.style.color='#D60D20';
      status.textContent='Falha de conexão. Gere o PDF e envie manualmente para adm@comercialeleven.com.';
    });
  });
})();
document.getElementById('painel').addEventListener('input',render);
document.getElementById('painel').addEventListener('change',render);
if(!window._elevenPropostaImported){ addEquip({tipo:'Empilhadeira Elétrica'}); }
render();
</script>
